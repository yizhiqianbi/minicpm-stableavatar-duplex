[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-duplex-avatar"
version = "0.1.0"
description = "A research baseline for MiniCPM-o full-duplex interaction and StableAvatar video rendering."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
h3 = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.50",
  "accelerate>=1.0",
]
minicpm = [
  "torch>=2.4",
  "transformers>=4.50",
  "websockets>=12.0",
]
stableavatar = [
  "torch>=2.4",
  "torchvision>=0.19",
  "torchaudio>=2.4",
  "diffusers>=0.30",
  "transformers>=4.45",
  "accelerate>=1.0",
  "librosa>=0.10",
  "omegaconf>=2.3",
  "einops>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
